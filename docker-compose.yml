services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonic
      POSTGRES_PASSWORD: sonic
      POSTGRES_DB: sonic
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonic"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  api:
    build: .
    command: node src/index.js
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8080:8080"]
    restart: unless-stopped

  worker:
    build: .
    command: node src/worker/poller.js
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
